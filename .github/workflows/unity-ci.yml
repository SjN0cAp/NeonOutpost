name: Unity CI

on:
  push:
    branches: [ main, develop, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: always runs. Checks that the project and all lab deliverables are in place.
  check:
    name: Check project files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Unity project folders
        run: |
          for d in Assets Packages ProjectSettings; do
            test -d "$d" || { echo "Missing folder: $d"; exit 1; }
          done
          echo "Unity project folders found."

      - name: Check lab deliverables
        run: |
          for f in \
            ProjectManagement/SprintBacklog.md \
            ProjectManagement/GitWorkflow.md \
            ProjectManagement/RiskMatrix.md \
            ProjectManagement/ProductionReadiness.md \
            Assets/Scripts/EnemyChase.cs \
            Assets/Scripts/WaveSpawner.cs \
            Assets/Tests/EditMode/NeonOutpostTests.cs; do
            test -f "$f" || { echo "Missing file: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Check that Library and Temp are not committed
        run: |
          if [ -d Library ] || [ -d Temp ]; then
            echo "Library/ or Temp/ was committed. Fix .gitignore."; exit 1
          fi
          echo ".gitignore is working."

  # Jobs 2 and 3: Unity tests and build with GameCI.
  # They need a Unity license and a GameCI Docker image for this Unity version.
  # Turn them on by setting the repository variable ENABLE_UNITY_CI to true.
  test:
    name: Run EditMode tests
    needs: check
    if: vars.ENABLE_UNITY_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Windows
    needs: test
    if: vars.ENABLE_UNITY_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NeonOutpost-Windows
          path: build/StandaloneWindows64
